<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Study Hub - Select Workspace</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=Cairo:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #030712;
            --glass-bg: rgba(17, 24, 39, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --primary: #00f2fe;
            --accent: #3b82f6;
            --purple: #a855f7;
            --pink: #f43f5e;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --font-outfit: 'Outfit', sans-serif;
            --font-cairo: 'Cairo', sans-serif;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }

        * { box-sizing: border-box; outline: none; margin: 0; padding: 0; }

        body {
            font-family: var(--font-outfit), var(--font-cairo), sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 15px;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
        }

        .bg-glow-1, .bg-glow-2 {
            position: fixed; width: 250px; height: 250px; border-radius: 50%; z-index: -1; opacity: 0.12; filter: blur(70px); pointer-events: none; animation: floatGlow 10s infinite alternate;
        }
        .bg-glow-1 { top: -5%; left: 5%; background: var(--primary); }
        .bg-glow-2 { bottom: -5%; right: 5%; background: var(--purple); animation-delay: 3s; }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(15px) scale(1.1); }
        }

        .container {
            width: 100%; max-width: 900px; padding: 20px 5px; text-align: center; z-index: 5;
        }

        /* شريط عرض وتحرير الاسم بالأعلى */
        .user-profile-header {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: 50px;
            display: inline-flex;
            animation: fadeIn 0.4s ease-out;
        }
        .user-profile-header .welcome {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .user-profile-header .username {
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--primary);
            font-family: var(--font-cairo), var(--font-outfit), sans-serif;
        }
        .user-profile-header .edit-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            transition: transform 0.2s;
        }
        .user-profile-header .edit-btn:hover {
            transform: scale(1.15);
        }

        h1 {
            font-size: calc(1.8rem + 1.5vw); font-weight: 900; letter-spacing: 1px; margin-bottom: 8px;
            background: linear-gradient(90deg, var(--primary), var(--purple), var(--pink), var(--primary));
            background-size: 300% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: textFlow 8s linear infinite;
        }

        @keyframes textFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        p.subtitle {
            color: var(--text-muted); font-size: calc(0.85rem + 0.2vw); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;
        }

        .room-badge {
            display: inline-block; background: rgba(17, 24, 39, 0.8); 
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 8px 20px; border-radius: 50px; font-weight: 700; color: var(--primary);
            margin-bottom: 35px; font-size: 0.8rem; letter-spacing: 0.5px;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.05); border-color: rgba(0, 242, 254, 0.2); }
            100% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); border-color: rgba(0, 242, 254, 0.5); }
        }

        .workspace-deck {
            display: flex; flex-direction: row; flex-wrap: nowrap; gap: 15px; justify-content: center; width: 100%;
        }

        .engine-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; padding: 30px 20px; text-align: left;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
            width: 50%; max-width: 380px; 
        }

        .engine-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: transparent; transition: all 0.3s;
        }
        .engine-card.ml:hover::before { background: linear-gradient(90deg, var(--primary), var(--accent)); }
        .engine-card.bd:hover::before { background: linear-gradient(90deg, var(--purple), var(--pink)); }

        @media (hover: hover) {
            .engine-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); }
            .engine-card.ml:hover { border-color: rgba(0, 242, 254, 0.25); }
            .engine-card.bd:hover { border-color: rgba(168, 85, 247, 0.25); }
            .engine-card:hover .engine-icon { transform: scale(1.05); }
        }

        .engine-icon {
            width: 70px; height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; transition: all 0.4s;
        }
        .ml .engine-icon { background: rgba(0, 242, 254, 0.06); color: var(--primary); border: 1px solid rgba(0, 242, 254, 0.1); }
        .bd .engine-icon { background: rgba(168, 85, 247, 0.06); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.1); }

        .engine-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 6px; color: #fff; letter-spacing: 0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .engine-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.4; margin-bottom: 20px; font-weight: 400; }

        .enter-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 10px; border-radius: 10px; width: 100%; text-align: center;
            font-weight: 700; font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase;
            transition: all 0.3s; color: var(--text-main); cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .ml:hover .enter-btn, .ml:active .enter-btn { background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); border-color: transparent; }
        .bd:hover .enter-btn, .bd:active .enter-btn { background: linear-gradient(90deg, var(--purple), var(--pink)); color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); border-color: transparent; }

        /* شاشة إدخال الاسم المنبثقة والزجاجية الفاخرة */
        .name-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .name-modal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 40px 30px; border-radius: 28px; width: 90%; max-width: 420px;
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
        }

        .name-modal-card h2 {
            font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .name-modal-card p {
            color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; font-family: var(--font-cairo), sans-serif;
        }

        .name-input-wrapper {
            position: relative; margin-bottom: 22px; width: 100%;
        }

        .name-input {
            width: 100%; padding: 16px 20px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            color: #fff; font-size: 1rem; text-align: center;
            font-family: var(--font-cairo), var(--font-outfit), sans-serif;
            transition: all 0.3s ease;
        }
        .name-input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.04);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .name-submit-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-weight: 900; font-size: 0.9rem; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
            background: linear-gradient(90deg, var(--primary), var(--purple));
            color: #030712; font-family: var(--font-cairo), var(--font-outfit), sans-serif;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.2);
        }
        .name-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.35);
        }
        .name-submit-btn:active {
            transform: translateY(0);
        }

        .modal-close-x {
            position: absolute; top: 18px; right: 22px;
            background: transparent; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; display: none; transition: color 0.2s;
        }
        .modal-close-x:hover { color: #fff; }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .workspace-deck { gap: 10px; padding: 0 5px; }
            .engine-card { padding: 20px 12px; border-radius: 16px; }
            .engine-icon { width: 50px; height: 50px; border-radius: 12px; margin-bottom: 15px; }
            .engine-icon svg { width: 28px; height: 28px; }
            .engine-title { font-size: 1.05rem; }
            .engine-desc { font-size: 0.8rem; margin-bottom: 15px; }
            .enter-btn { font-size: 0.75rem; padding: 8px 5px; letter-spacing: 0px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- واجهة تسجيل الاسم المنبثقة والمحمية -->
<div class="name-modal-overlay" id="nameModalOverlay">
    <div class="name-modal-card">
        <button class="modal-close-x" id="modalCloseBtn" onclick="closeNameModal()">✕</button>
        <h2>ENTER YOUR NAME</h2>
        <p>يرجى إدخال اسمك الحقيقي للانضمام لزملائك في الغرفة</p>
        <div class="name-input-wrapper">
            <input type="text" id="usernameInput" class="name-input" placeholder="اكتب اسمك هنا..." autocomplete="off">
        </div>
        <button class="name-submit-btn" onclick="saveUsernameAndContinue()">انضمام للجلسة</button>
    </div>
</div>

<div class="container">
    <!-- شريط ترحيب باسم الطالب بالأعلى -->
    <div class="user-profile-header" id="userProfileHeader">
        <span class="welcome">مرحباً بك،</span>
        <span class="username" id="displayUsername">...</span>
        <button class="edit-btn" onclick="openNameEditModal()" title="تعديل الاسم">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </button>
    </div>

    <h1>STUDY HUB</h1>
    <p class="subtitle">4th Year IT</p>
    
    <div class="room-badge" id="roomDisplay">CONNECTING TO NETWORK...</div>

    <div class="workspace-deck">
        <div class="engine-card ml" onclick="launchWorkspace('ml_suite.html')">
            <div>
                <div class="engine-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"></rect><rect x="2" y="14" width="20" height="8" rx="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                </div>
                <div class="engine-title">Machine Learning</div>
                <div class="engine-desc">Models & Intelligence.</div>
            </div>
            <button class="enter-btn">Open Hub</button>
        </div>

        <div class="engine-card bd" onclick="launchWorkspace('bigdata_suite.html')">
            <div>
                <div class="engine-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-2.239 10-5V5c0-2.761-4.477-5-10-5S2 2.239 2 5v12c0 2.761 4.477 5 10 5z"></path><path d="M22 5s-4 2-10 2S2 5 2 5"></path><path d="M22 11s-4 2-10 2S2 11 2 11"></path></svg>
                </div>
                <div class="engine-title">Big Data</div>
                <div class="engine-desc">Data & Clusters.</div>
            </div>
            <button class="enter-btn">Open Cluster</button>
        </div>
    </div>
</div>

<script>
    let urlParams = new URLSearchParams(window.location.search);
    let roomName = urlParams.get('room');

    if (!roomName) {
        const randomId = Math.floor(1000 + Math.random() * 9000);
        roomName = `room_${randomId}`;
        urlParams.set('room', roomName);
        window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
    }

    document.getElementById('roomDisplay').innerText = `ACTIVE ROOM: ${roomName.toUpperCase()}`;

    // تفعيل ومراقبة تسجيل اسم المستخدم
    function initializeUserAuthentication() {
        const storedUsername = localStorage.getItem('study_hub_user_realname');
        
        if (!storedUsername || storedUsername.trim() === '') {
            // أول دخول: إجبار المستخدم على تسجيل الاسم ولا يمكن إغلاق النافذة
            document.getElementById('modalCloseBtn').style.display = 'none';
            document.getElementById('nameModalOverlay').style.display = 'flex';
            document.getElementById('userProfileHeader').style.display = 'none';
        } else {
            // الاسم موجود مسبقاً: عرضه بالأعلى مباشرة
            showProfileHeader(storedUsername);
        }
    }

    function showProfileHeader(username) {
        document.getElementById('nameModalOverlay').style.display = 'none';
        document.getElementById('userProfileHeader').style.display = 'inline-flex';
        document.getElementById('displayUsername').innerText = username;
    }

    function saveUsernameAndContinue() {
        const nameVal = document.getElementById('usernameInput').value.trim();
        if (nameVal === '') {
            alert('يرجى كتابة اسم صحيح للاستمرار.');
            return;
        }
        localStorage.setItem('study_hub_user_realname', nameVal);
        showProfileHeader(nameVal);
    }

    function openNameEditModal() {
        const currentName = localStorage.getItem('study_hub_user_realname') || '';
        document.getElementById('usernameInput').value = currentName;
        // السماح بإغلاق النافذة عند تعديل الاسم الاختياري
        document.getElementById('modalCloseBtn').style.display = 'block';
        document.getElementById('nameModalOverlay').style.display = 'flex';
    }

    function closeNameModal() {
        const storedUsername = localStorage.getItem('study_hub_user_realname');
        if (storedUsername && storedUsername.trim() !== '') {
            document.getElementById('nameModalOverlay').style.display = 'none';
        }
    }

    function launchWorkspace(targetSuiteFile) {
        const username = localStorage.getItem('study_hub_user_realname') || 'Anonymous';
        window.location.href = `${targetSuiteFile}?room=${roomName}&username=${encodeURIComponent(username)}`;
    }

    // تفعيل النظام بمجرد تحميل الصفحة
    initializeUserAuthentication();
</script>
</body>
</html>
