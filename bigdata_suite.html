<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data & Analytics Workspace - Fullscreen Optimization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800;900&family=Cairo:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #020617;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #a855f7;
            --primary-dim: rgba(168, 85, 247, 0.12);
            --primary-glow: rgba(168, 85, 247, 0.5);
            --accent: #ec4899;
            --accent-dim: rgba(236, 72, 153, 0.12);
            --accent-glow: rgba(236, 72, 153, 0.5);
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* الهيدر ونظام التحكم العائم */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        header.minimized-cradle {
            padding: 8px 24px;
            background: rgba(15, 23, 42, 0.85);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-glow);
            animation: pulse 2s infinite;
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-hub {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* أزرار التحكم المتطورة */
        .btn-status {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .active-streaming {
            background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
            border-color: transparent !important;
            box-shadow: 0 4px 20px var(--primary-glow);
            animation: activePulse 2s infinite alternate;
        }

        /* مساحة العمل والشبكة الذكية */
        .workspace-container {
            margin-top: 90px;
            padding: 24px;
            width: 100%;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        /* لوحة الشات والأسئلة الأساسية المحسنة */
        .qa-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 150px);
            min-height: 550px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .qa-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .qa-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qa-title h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: 'Cairo', sans-serif;
        }

        .live-indicator {
            background: var(--primary-dim);
            color: var(--primary);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* منطقة تغذية وعرض الأسئلة */
        .questions-feed {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* تخصيص السكرول بار */
        .questions-feed::-webkit-scrollbar {
            width: 6px;
        }
        .questions-feed::-webkit-scrollbar-track {
            background: transparent;
        }
        .questions-feed::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .questions-feed::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* بطاقة السؤال المباشر */
        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s ease forwards;
        }

        .question-card:hover {
            transform: translateY(-2px);
            border-color: rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .question-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .question-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .question-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            font-family: 'Cairo', sans-serif;
            text-align: right;
            direction: rtl;
        }

        /* صندوق إدخال وإرسال الأسئلة الجديد */
        .qa-footer {
            padding: 18px 24px;
            border-top: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.4);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 6px 6px 6px 16px;
            border-radius: 16px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 14px var(--primary-dim);
        }

        .qa-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            text-align: right;
            padding: 8px 0;
        }

        .qa-input::placeholder {
            color: var(--text-muted);
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-send:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        /* الأنميشن والنبضات */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(236, 72, 153, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }

        @keyframes activePulse {
            0% { box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
            100% { box-shadow: 0 4px 28px rgba(236, 72, 153, 0.7); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header { padding: 12px 16px; }
            .brand h1 { font-size: 1rem; }
            .workspace-container { padding: 12px; margin-top: 80px; }
            .qa-panel { height: calc(100vh - 120px); }
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="brand">
            <div class="brand-dot"></div>
            <h1>BIG DATA WORKSPACE</h1>
        </div>
        
        <div class="controls-hub">
            <button id="micToggleBtn" class="btn-status active-streaming" onclick="toggleLocalMicrophone()">
                🎙️ MIC ACTIVE (LIVE)
            </button>
        </div>
    </header>

    <main class="workspace-container">
        <div class="workspace-grid">
            
            <section class="qa-panel">
                <div class="qa-header">
                    <span class="live-indicator">LIVE FEED</span>
                    <div class="qa-title">
                        <h2>الأسئلة والدردشة المباشرة</h2>
                        <span>💬</span>
                    </div>
                </div>

                <div class="questions-feed" id="questionsFeed">
                    </div>

                <div class="qa-footer">
                    <form id="qaForm" onsubmit="handleQuestionSubmit(event)">
                        <div class="input-wrapper">
                            <button type="submit" class="btn-send">إرسال 🚀</button>
                            <input type="text" id="questionInput" class="qa-input" placeholder="اكتب سؤالك أو استفسارك هنا ليظهر فوراً بالشات..." autocomplete="off" required>
                        </div>
                    </form>
                </div>
            </section>

        </div>
    </main>

<script>
    let localAudioStream = null;
    let lastScrollTop = 0;

    // مصفوفة تجريبية لحقن أسئلة أولية عند التحميل لضمان عمل "قراءة وعرض الأسئلة" فوراً
    const initialQuestions = [
        { name: "أحمد المالي", text: "هل يمكن ربط شاشات التحليل الرسومية بمصادر بيانات ضخمة كـ Hadoop بشكل فوري؟", time: "منذ دقيقة" },
        { name: "سارة المهندسة", text: "النظام ممتاز جداً، هل يوجد ميزة لتصدير تقارير الأسئلة المباشرة بعد انتهاء الجلسة؟", time: "منذ 3 دقائق" }
    ];

    // دالة تهيئة شاشة الأسئلة والأنظمة التابعة لها عند التحميل
    function initSuite() {
        // تحميل الأسئلة الأولية في الشات
        initialQuestions.forEach(q => appendQuestion(q.name, q.text, q.time));
        
        // تشغيل محاكي الأسئلة التلقائي لاستقبال أسئلة مستمرة وعرضها حية
        startLiveQuestionsSimulator();
    }

    // دالة إضافة سؤال جديد في واجهة المستخدم وقراءته وعرضه بالكامل
    function appendQuestion(name, text, time = "الآن") {
        const feed = document.getElementById('questionsFeed');
        if (!feed) return;

        // إنشاء بطاقة السؤال بهيكلية CSS الحديثة
        const card = document.createElement('div');
        card.className = 'question-card';
        
        // جلب أول حرف من الاسم للأفاتار
        const firstChar = name ? name.trim().charAt(0) : "U";

        card.innerHTML = `
            <div class="question-meta">
                <span class="question-time">${time}</span>
                <div class="user-info">
                    <span class="user-name">${name}</span>
                    <div class="user-avatar">${firstChar}</div>
                </div>
            </div>
            <div class="question-body">${text}</div>
        `;

        // إدراج البطاقة في الشات
        feed.appendChild(card);
        
        // التمرير التلقائي لأسفل الشات لمشاهدة السؤال الجديد فوراً
        feed.scrollTop = feed.scrollHeight;
    }

    // معالجة إرسال السؤال من صندوق الإدخال يدوياً
    function handleQuestionSubmit(event) {
        event.preventDefault();
        const input = document.getElementById('questionInput');
        if (!input || !input.value.trim()) return;

        // إضافة السؤال للشات باسمك كمسؤول/مستخدم
        appendQuestion("أنت (المضيف)", input.value.trim(), "الآن");
        
        // تفريغ الحقل
        input.value = "";
    }

    // محاكي ديناميكي يضخ أسئلة جديدة تلقائياً كل 15 ثانية للتأكد من أن الكود "يقرأ الأسئلة باستمرار"
    function startLiveQuestionsSimulator() {
        const mockDatabase = [
            { name: "خالد العتيبي", text: "هل هناك قيود على حجم البيانات المرفوعة أثناء البث الصوتي الحركي؟" },
            { name: "د. ريم مصطفى", text: "كيف يمكنني تفعيل التنبيهات الذكية عند حدوث طفرة مفاجئة في أداء السيرفر؟" },
            { name: "عمر فاروق", text: "الرجاء توضيح طريقة معالجة البيانات النصية غير المهيكلة داخل الـ Workspace." },
            { name: "م. ناصر الحارثي", text: "هل تدعم هذه النسخة المحسنة بروتوكولات الأمان العالية وتشفير الطرفين؟" }
        ];

        let index = 0;
        setInterval(() => {
            if (index < mockDatabase.length) {
                appendQuestion(mockDatabase[index].name, mockDatabase[index].text, "الآن");
                index++;
            }
        }, 15000); // سؤال جديد يظهر تلقائياً كل 15 ثانية
    }

    // --- المحرك الصوتي المتطور (WebRTC / PeerJS Interface) ---
    function initializeVoiceEngine() {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
        .then(stream => {
            localAudioStream = stream;
            console.log("تم تفعيل ميكروفون البث بنجاح والتوصيل بجهاز تحكم الصوت الرئيسي.");
        })
        .catch(err => {
            console.error("لم يتم العثور على صلاحيات المايك: ", err);
            const btn = document.getElementById('micToggleBtn');
            if(btn) {
                btn.innerText = "❌ MIC ERROR";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });
    }

    function toggleLocalMicrophone() {
        if (!localAudioStream) {
            initializeVoiceEngine();
            return;
        }
        const btn = document.getElementById('micToggleBtn');
        const audioTrack = localAudioStream.getAudioTracks()[0];
        
        if (audioTrack.enabled) {
            audioTrack.enabled = false;
            btn.classList.remove('active-streaming');
            btn.style.background = "var(--glass-bg)";
            btn.style.borderColor = "var(--warning)";
            btn.style.color = "var(--warning)";
            btn.innerText = "🔇 MIC MUTED";
        } else {
            audioTrack.enabled = true;
            btn.classList.add('active-streaming');
            btn.style.background = ""; btn.style.borderColor = ""; btn.style.color = "";
            btn.innerText = "🎙️ MIC ACTIVE (LIVE)";
        }
    }

    // نظام تقليص وتوسيع الهيدر التلقائي عند التمرير لحماية مساحة الرؤية للشات
    window.addEventListener('scroll', () => {
        const headerElement = document.getElementById('mainHeader');
        let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
        
        if (currentScroll > lastScrollTop && currentScroll > 80) {
            headerElement.classList.add('minimized-cradle');
        } else if (currentScroll < lastScrollTop) {
            headerElement.classList.remove('minimized-cradle');
        }
        lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
    });

    // تشغيل المحركات والأسئلة فور اكتمال تحميل عناصر الصفحة
    initializeVoiceEngine();
    initSuite();
</script>
</body>
</html>
