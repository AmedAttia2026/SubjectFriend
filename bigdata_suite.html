<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Big Data & Analytics Workspace - Premium & Active Sync</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght=300;400;500;600;700;800;900&family=Cairo:wght=400;600;700;900&display=swap');

        :root {
            --bg-dark: #060814;
            --glass-bg: rgba(13, 17, 33, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-hover: #a78bfa;
            --primary-dim: rgba(139, 92, 246, 0.15);
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #ec4899;
            --accent-dim: rgba(236, 72, 153, 0.12);
            --accent-glow: rgba(236, 72, 153, 0.4);
            --success: #10b981;
            --success-dim: rgba(16, 185, 129, 0.15);
            --success-glow: rgba(16, 185, 129, 0.4);
            --danger: #f43f5e; 
            --danger-dim: rgba(244, 63, 94, 0.15);
            --danger-glow: rgba(244, 63, 94, 0.4);
            --warning: #fbbf24;
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.35);
            --focus-blue: #00f0ff;
            --focus-blue-glow: rgba(0, 240, 255, 0.45);
            --text-main: #f8fafc;
            --text-option: #e2e8f0;
            --text-muted: #94a3b8;
            --font-outfit: 'Outfit', sans-serif;
            --font-cairo: 'Cairo', sans-serif;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: var(--font-outfit), var(--font-cairo), sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 220px; 
            padding-bottom: 80px;
        }

        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-image: 
                linear-gradient(to right, rgba(139, 92, 246, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(139, 92, 246, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 90%);
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.18;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -10%; left: -5%; }
        .orb-2 { width: 600px; height: 600px; background: var(--primary); bottom: -15%; right: -5%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.1); }
        }

        header {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1100px; z-index: 100;
            background: rgba(10, 14, 31, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, top 0.4s;
            overflow: hidden;
        }

        .brand-title, 
        .stats-badge, 
        .controls-header-row, 
        .sheet-navigator, 
        .progress-container {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        header.hide-nav {
            transform: translateX(-50%) translateY(-140%);
            opacity: 0;
            pointer-events: none;
        }

        .header-content {
            padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 1.05rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff, var(--primary-hover));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
        }

        .header-badges-group {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }

        /* دمج الكنترول الصوتي والأعضاء بشكل مبسط جداً بدون نصوص إنجليزية */
        .voice-hub {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .voice-mic-btn {
            background: var(--danger-dim); border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--danger); width: 38px; height: 38px; border-radius: 12px;
            font-size: 1.05rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-shadow: 0 0 5px var(--danger-glow);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
        }

        .voice-mic-btn.active-streaming {
            background: var(--success-dim); border-color: rgba(16, 185, 129, 0.3);
            color: var(--success); text-shadow: 0 0 5px var(--success-glow);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
        }

        .members-toggle-btn {
            border-color: rgba(0, 240, 255, 0.35); 
            color: var(--focus-blue); 
            font-weight: 800;
            height: 38px;
            padding: 0 14px;
            border-radius: 12px;
            background: rgba(0, 240, 255, 0.03);
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .stats-badge {
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 0 16px; border-radius: 12px; font-weight: 800; font-size: 0.9rem;
            letter-spacing: 0.5px; height: 38px;
            color: var(--primary-hover);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* تصميم الكبسولة العائمة المبسطة عند النزول بالصفحة واختفاء المنيو */
        .floating-minimal-capsule {
            position: fixed;
            top: 15px;
            right: 24px;
            background: rgba(10, 14, 31, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 4px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(139, 92, 246, 0.15);
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .floating-minimal-capsule.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .float-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .float-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .float-divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
        }
        .float-score-box {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary-hover);
            text-shadow: 0 0 8px var(--primary-glow);
            padding: 0 4px;
        }

        .controls-header-row {
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px 24px;
            display: flex; justify-content: flex-start; gap: 12px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03); color: var(--text-option); border: 1px solid var(--glass-border);
            padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 0.75rem;
            cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; gap: 8px;
            letter-spacing: 0.8px; white-space: nowrap; text-transform: uppercase;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.07); color: #fff; border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .action-btn.mix { 
            border-color: rgba(139, 92, 246, 0.3); color: var(--primary-hover); 
        }
        .action-btn.mix:hover { 
            background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary-glow); border-color: var(--primary);
        }
        .action-btn.retry { 
            background: linear-gradient(135deg, var(--gold), #d97706); color: #060814; font-weight: 900; border: none; 
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2);
        }
        .action-btn.retry:hover {
            transform: translateY(-2px); box-shadow: 0 6px 20px rgba(251, 191, 36, 0.35);
        }

        /* نافذة لوحة الأعضاء الجانبية المتطورة */
        .members-panel {
            position: fixed;
            top: 145px;
            right: 24px;
            width: 320px;
            max-height: 400px;
            background: rgba(10, 14, 31, 0.95);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--focus-blue);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 20px rgba(0, 240, 255, 0.15);
            z-index: 120;
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideDownPanel 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideDownPanel {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .members-panel .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .members-panel .panel-header h3 {
            font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; color: var(--focus-blue);
            font-family: var(--font-outfit), sans-serif;
        }
        .members-panel .panel-header button {
            background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer;
        }
        .members-panel .panel-body {
            padding: 10px; overflow-y: auto; max-height: 320px;
        }
        .member-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; transition: background 0.2s;
        }
        .member-item:hover { background: rgba(255,255,255,0.02); }
        .member-status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success-glow);
        }
        .member-details { display: flex; flex-direction: column; gap: 2px; text-align: left; }
        .member-name { font-size: 0.9rem; font-weight: 700; color: #fff; font-family: var(--font-cairo), sans-serif; }
        .member-name .me-tag { font-size: 0.7rem; color: var(--primary-hover); margin-left: 4px; font-weight: 500; }
        .member-peer-id { font-size: 0.7rem; color: var(--text-muted); }

        .sheet-navigator, .bottom-navigator-deck {
            background: rgba(255, 255, 255, 0.01);
            display: flex; justify-content: flex-start; overflow-x: auto; scrollbar-width: none;
        }
        .sheet-navigator::-webkit-scrollbar, .bottom-navigator-deck::-webkit-scrollbar { display: none; }

        .bottom-navigator-deck {
            border: 1px solid var(--glass-border);
            border-radius: 18px; background: var(--glass-bg);
            padding: 4px; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
            justify-content: space-around;
        }

        .tab-btn, .bottom-nav-btn {
            background: transparent; color: var(--text-muted); border: none;
            padding: 14px 24px; font-weight: 700; font-size: 0.8rem; letter-spacing: 1.2px;
            cursor: pointer; transition: all 0.25s ease; text-transform: uppercase;
            position: relative; white-space: nowrap; flex: 1; text-align: center;
        }
        .tab-btn:hover, .bottom-nav-btn:hover { color: var(--text-main); }
        .tab-btn.active, .bottom-nav-btn.active { color: var(--primary-hover); font-weight: 900; }
        .tab-btn.active::after, .bottom-nav-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 3px;
            background: linear-gradient(to right, var(--primary), var(--accent)); border-radius: 3px 3px 0 0;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .mode-selection-deck {
            display: flex; justify-content: center; gap: 14px; margin: 35px auto 25px;
            max-width: 900px; padding: 0 15px; flex-wrap: wrap;
        }

        .mode-select-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border);
            padding: 14px 24px; border-radius: 16px; cursor: pointer;
            font-size: 0.85rem; font-weight: 800; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); flex: 1; min-width: 140px; justify-content: center;
        }

        .mode-select-card:hover { border-color: rgba(255, 255, 255, 0.15); color: #fff; transform: translateY(-3px); }
        .mode-select-card.active-tf { color: var(--primary-hover); border-color: var(--primary); background: var(--primary-dim); box-shadow: 0 0 25px rgba(139, 92, 246, 0.25); }
        .mode-select-card.active-mcq { color: #f43f5e; border-color: #f43f5e; background: var(--danger-dim); box-shadow: 0 0 25px rgba(244, 63, 94, 0.25); }
        .mode-select-card.active-blank { color: var(--gold); border-color: var(--gold); background: rgba(251, 191, 36, 0.08); box-shadow: 0 0 25px rgba(251, 191, 36, 0.25); }
        .mode-select-card.active-written { color: var(--success); border-color: var(--success); background: var(--success-dim); box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }

        .scroll-top-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: rgba(13, 17, 33, 0.8); border: 1px solid var(--glass-border);
            color: var(--primary-hover); border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 99;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px var(--primary-glow);
            opacity: 0; transform: translateY(20px); pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }
        .scroll-top-btn.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .scroll-top-btn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 25px var(--primary-glow); transform: translateY(-4px); }
        .scroll-top-btn svg { width: 22px; height: 22px; transition: transform 0.3s; }
        .scroll-top-btn:hover svg { transform: translateY(-3px); }

        .container { max-width: 850px; margin: 30px auto 40px; padding: 0 20px; }
        
        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .assignment-sheet { display: none; }
        .assignment-sheet.active { 
            display: block; 
            animation: fadeInSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 28px; margin-bottom: 30px;
            position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card::before { 
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; 
            background: linear-gradient(to right, transparent, transparent); transition: all 0.4s; 
        }
        .card:hover { 
            transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.15); 
            box-shadow: 0 20px 45px rgba(0,0,0,0.5); 
        }
        
        .card.focused-by-peer {
            border-color: var(--focus-blue) !important;
            box-shadow: 0 0 35px var(--focus-blue-glow) !important;
            background: rgba(0, 240, 255, 0.03) !important;
        }
        .card.focused-by-peer::before {
            background: linear-gradient(to right, var(--focus-blue), var(--primary));
        }

        .peer-focus-badge {
            display: none;
            position: absolute;
            top: 24px;
            right: 85px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: var(--focus-blue);
            font-size: 0.65rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            font-family: var(--font-cairo), sans-serif;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
            animation: pulseBlueFocus 1.5s infinite;
        }
        @keyframes pulseBlueFocus {
            0% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(0.98); }
        }
        .card.focused-by-peer .peer-focus-badge {
            display: inline-flex;
        }

        .question-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; position: relative; width: 100%; }
        .q-number {
            background: var(--primary-dim); border: 1px solid rgba(139, 92, 246, 0.25); color: var(--primary-hover);
            font-size: 0.75rem; font-weight: 900; padding: 6px 10px; border-radius: 10px; flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.6; color: #fff; text-align: left; padding-right: 80px; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .option-label {
            position: relative; display: flex; align-items: center; background: rgba(255,255,255,0.015);
            border: 1px solid var(--glass-border); padding: 16px 20px; border-radius: 16px;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); font-size: 1rem; font-weight: 500; color: var(--text-option);
            overflow: hidden;
        }
        .option-label::before { 
            content: ''; position: absolute; left: 0; top: 0; width: 0%; height: 100%; 
            background: var(--primary-dim); transition: width 0.35s ease; z-index: 0; 
        }
        .option-label span, .option-label .custom-radio { position: relative; z-index: 1; }
        
        .option-label:hover { 
            border-color: rgba(255,255,255,0.15); color: #fff; transform: translateX(6px); 
            background: rgba(255,255,255,0.03);
        }
        .option-label input { display: none; }
        
        .custom-radio {
            width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 50%;
            margin-right: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease; background: rgba(0,0,0,0.2);
        }
        .custom-radio::after { 
            content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); 
            transform: scale(0); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .option-label.selected { border-color: var(--primary); color: #fff; font-weight: 700; }
        .option-label.selected::before { width: 100%; }
        .option-label.selected .custom-radio { border-color: var(--primary); }
        .option-label.selected .custom-radio::after { transform: scale(1); }

        .card.correct .option-label.selected { 
            border: 2px solid var(--success) !important; 
            background: rgba(16, 185, 129, 0.12) !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            color: #fff !important;
            font-weight: 700;
        }
        .card.correct .option-label.selected .custom-radio { 
            border-color: var(--success) !important; 
            background: var(--success) !important; 
        }
        .card.correct .option-label.selected .custom-radio::after { 
            background: #060814 !important; 
            transform: scale(1); 
        }

        .card.wrong .option-label.selected { 
            border: 2px solid var(--danger) !important; 
            background: rgba(244, 63, 94, 0.12) !important;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
            color: #fff !important;
            font-weight: 700;
        }
        .card.wrong .option-label.selected .custom-radio { 
            border-color: var(--danger) !important; 
            background: var(--danger) !important; 
        }
        .card.wrong .option-label.selected .custom-radio::after { 
            background: #fff !important; 
            transform: scale(1); 
        }

        .card.wrong .option-label.true-answer {
            border: 2px dashed rgba(16, 185, 129, 0.6) !important; 
            background: rgba(16, 185, 129, 0.05) !important; 
            color: var(--success) !important; 
            font-weight: 700;
        }
        .card.wrong .option-label.true-answer .custom-radio { 
            border-color: var(--success) !important; 
        }

        .blank-input-wrapper { margin: 10px 0 0 0; width: 100%; position: relative; }
        
        .expected-answer-box {
            display: none; background: rgba(251, 191, 36, 0.03); border: 1.5px dashed rgba(251, 191, 36, 0.4);
            padding: 20px; border-radius: 18px; font-size: 1.15rem; color: #f8fafc;
            text-align: left; line-height: 1.7 !important; box-shadow: 0 8px 30px rgba(251, 191, 36, 0.08);
            direction: ltr !important; white-space: pre-line; margin-top: 15px;
            animation: fadeInSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .ar-translation-vault {
            display: none; background: rgba(139, 92, 246, 0.03); border-right: 4px solid var(--primary);
            padding: 20px; border-radius: 16px; font-size: 1.15rem; color: #f1f5f9;
            text-align: right; line-height: 1.8 !important; font-family: var(--font-cairo), sans-serif;
            direction: rtl !important; white-space: pre-line;

    function scrollToTop() {
        isProgrammaticScrolling = true;
        if (programmaticScrollTimeout) clearTimeout(programmaticScrollTimeout);

        const startTime = performance.now();
        const startY = window.pageYOffset;
        const duration = 250; 

        function step(currentTime) {
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            window.scrollTo(0, startY * (1 - ease));
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                programmaticScrollTimeout = setTimeout(() => {
                    isProgrammaticScrolling = false;
                }, 100);
            }
        }
        requestAnimationFrame(step);
    }

    function fastScrollTo(element) {
        if (!element) return;
        isProgrammaticScrolling = true;
        if (programmaticScrollTimeout) clearTimeout(programmaticScrollTimeout);

        const elementRect = element.getBoundingClientRect();
        const absoluteElementTop = elementRect.top + window.pageYOffset;
        const middle = absoluteElementTop - (window.innerHeight / 2) + (elementRect.height / 2);
        
        const startTime = performance.now();
        const startY = window.pageYOffset;
        const difference = middle - startY;
        const duration = 250; 

        function step(currentTime) {
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3); 
            window.scrollTo(0, startY + difference * ease);
            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                programmaticScrollTimeout = setTimeout(() => {
                    isProgrammaticScrolling = false;
                }, 100);
            }
        }
        requestAnimationFrame(step);
    }

    function playAudioFeedback(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            if (type === 'correct') {
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc1.type = 'sine'; osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(523.25, ctx.currentTime); 
                osc1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08); 
                osc1.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16); 
                
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
                
                osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
                osc1.start(); osc2.start();
                osc1.stop(ctx.currentTime + 0.45); osc2.stop(ctx.currentTime + 0.45);
            } else if (type === 'wrong') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const filter = ctx.createBiquadFilter();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.35);
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(380, ctx.currentTime);
                
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                
                osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            }
        } catch (e) {}
    }

    function renderCurrentView() {
        const needsRender = (currentSheetIndex !== lastRenderedSheet || currentGlobalMode !== lastRenderedMode);

        assignmentsConfig.forEach(sheet => {
            const container = document.getElementById(`sheet-${sheet.id}`);
            if (sheet.id === currentSheetIndex) {
                if (needsRender || container.innerHTML === "") {
                    let targetData = sheet.tf;
                    if(currentGlobalMode === 'mcq' || currentGlobalMode === 'blank') targetData = sheet.mcq;
                    else if(currentGlobalMode === 'written') targetData = sheet.written || [];
                    renderBlock(container, sheet.id, targetData);
                }
            } else {
                container.innerHTML = ''; 
            }
        });

        if (needsRender) {
            lastRenderedSheet = currentSheetIndex;
            lastRenderedMode = currentGlobalMode;
        }
        updateProgress();
    }

            const card = document.createElement('div');

                });
            });
            
            let html = `
                <div class="peer-focus-badge" id="${cardId}-peer-badge">👤 PEER ACTIVE</div>
                
                <div class="question-header">
                    <button class="trans-trigger-btn" onclick="toggleArabicTranslation(this, '${vaultId}')">🌐 AR</button>
                    <div class="q-number">${formatNumber(index + 1)} / ${data.length}</div>
                    <div class="question-text">${formatText(item.q)}</div>
                </div>
            `;

            if (currentGlobalMode === 'blank' || currentGlobalMode === 'written') {
                const exactCorrectText = item.options ? item.options[item.ans] : item.a;
                html += `
                    <div class="blank-input-wrapper">
                        <div class="written-action-row" id="${cardId}-action-row">
                            <button class="written-btn wrong-assert" onclick="assertStudyStatus('${cardId}', false)">أحتاج مراجعته ❌</button>
                            <button class="written-btn correct-assert" onclick="assertStudyStatus('${cardId}', true)">أجبت صحيح ✅</button>
                        </div>

                        <div class="expected-answer-box">
                            <div style="color:var(--gold); font-weight:900; font-size:1.1rem; border-bottom:1px solid rgba(251,191,36,0.2); padding-bottom:6px; margin-bottom:10px; text-shadow: 0 0 12px var(--gold-glow); letter-spacing:1px;"><i class="fa-solid fa-gem"></i> ⚜️ ROYAL ANSWER VAULT</div>
                            <div style="font-weight:700; color:#fff; font-size:1.3rem; line-height:1.8;">${formatText(exactCorrectText)}</div>
                        </div>

                        <div class="ar-translation-vault" id="${vaultId}">
                            <div style="margin-bottom:12px; border-bottom:1px dashed rgba(255,255,255,0.1); padding-bottom:8px;"><b style="color:var(--primary);">السؤال مترجم:</b> ${formatText(item.qt || item.q)}</div>
                            <div><b style="color:var(--success);">الإجابة النموذجية:</b> ${formatText(item.at || exactCorrectText)}</div>
                        </div>
                    </div>
                `;
            } else {
                html += `<div class="options-grid">`;
                item.options.forEach((opt, i) => {
                    html += `
                        <label class="option-label" onclick="selectOption('${cardId}', ${i})">
                            <input type="radio" name="${cardId}" value="${i}">
                            <div class="custom-radio"></div>
                            <span><b>${opt}</b></span>
                        </label>
                    `;
                });
                html += `</div><button class="check-btn" onclick="checkRadioAnswer('${cardId}')">COMPUTE INFERENCE</button>`;
            }
            
            html += `<div class="result-box"></div>`;
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    function selectOption(cardId, optionIndex) {
        recordLocalAction();
        const card = document.getElementById(cardId);
        if(!card || card.classList.contains('correct') || card.classList.contains('wrong')) return;

        card.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('selected'));
        const selectedInput = card.querySelector(`input[value="${optionIndex}"]`);
        if(selectedInput) {
            selectedInput.checked = true;
            selectedInput.parentElement.classList.add('selected');
        }

        broadcastP2PState({
            type: 'select',
            cardId: cardId,
            optionIdx: optionIndex,
            username: localUsername
        });
    }

    function checkRadioAnswer(cardId) {
        recordLocalAction();
        const card = document.getElementById(cardId);
        const correctAns = parseInt(card.dataset.correct);
        const selectedInput = card.querySelector('input:checked');
        const resultBox = card.querySelector('.result-box');
        const btn = card.querySelector('.check-btn');

        if (!selectedInput) return;

        btn.disabled = true; btn.innerText = "WEIGHTS FROZEN";
        card.querySelectorAll('input').forEach(inp => inp.disabled = true);
        
        card.querySelectorAll('.option-label').forEach(lbl => {
            lbl.style.pointerEvents = 'none';
            if(parseInt(lbl.querySelector('input').value) === correctAns) lbl.classList.add('true-answer');
        });

        const selectedVal = parseInt(selectedInput.value);

        if (selectedVal === correctAns) {
            card.classList.add('correct');
            card.classList.add('correct-status');
            resultBox.innerHTML = `OPTIMAL CORRECTION (LOSS = 0.00)`;
            playAudioFeedback('correct'); 
            sendStateToBackend(cardId, selectedVal, 'correct', "");
            
            broadcastP2PState({
                type: 'freeze',
                cardId: cardId,
                status: 'correct',
                selectedIdx: selectedVal,
                username: localUsername
            });
        } else {
            card.classList.add('wrong');
            card.classList.add('wrong-status');
            resultBox.innerHTML = `INFERENCE MISMATCH (HIGH GRADIENT COST)`;
            playAudioFeedback('wrong'); 
            sendStateToBackend(cardId, selectedVal, 'wrong', "");
            
            broadcastP2PState({
                type: 'freeze',
                cardId: cardId,
                status: 'wrong',
                selectedIdx: selectedVal,
                username: localUsername
            });
        }
        updateProgress();
        triggerGroupNextScroll(card);
    }

    function assertStudyStatus(cardId, isCorrect) {
        recordLocalAction();
        const card = document.getElementById(cardId);
        const actionRow = document.getElementById(`${cardId}-action-row`);
        
        if(actionRow) actionRow.style.display = 'none';
        card.classList.add('revealed-vault');

        if(isCorrect) {
            card.classList.add('correct');
            card.classList.add('correct-status');
            playAudioFeedback('correct');
            sendStateToBackend(cardId, null, 'correct', "");
            
            broadcastP2PState({
                type: 'freeze',
                cardId: cardId,
                status: 'correct',
                username: localUsername
            });
        } else {
            card.classList.add('wrong');
            card.classList.add('wrong-status');
            playAudioFeedback('wrong');
            sendStateToBackend(cardId, null, 'wrong', "");
            
            broadcastP2PState({
                type: 'freeze',
                cardId: cardId,
                status: 'wrong',
                username: localUsername
            });
        }
        updateProgress();
        triggerGroupNextScroll(card);
    }

    function triggerGroupNextScroll(card) {
        recordLocalAction();
        const currentIndex = parseInt(card.dataset.index);
        const nextIndex = currentIndex + 1;
        const nextCardId = `sheet-${currentSheetIndex}-${currentGlobalMode}-q-${nextIndex}`;
        const nextCardExists = document.getElementById(nextCardId);
        
        if (typeof triggerUserActionBurst === 'function') triggerUserActionBurst();
        
        setTimeout(() => {
            if (nextCardExists) {
                fastScrollTo(nextCardExists);
                document.querySelectorAll('.card').forEach(c => {
                    c.classList.remove('focused-by-peer');
                    const badge = c.querySelector('.peer-focus-badge');
                    if (badge) badge.style.display = 'none';
                });
                nextCardExists.classList.add('focused-by-peer');

                sendStateToBackend(card.id, null, card.classList.contains('correct') ? 'correct' : 'wrong', "", { active_card_id: nextCardId });
                
                broadcastP2PState({
                    type: 'focus',
                    cardId: nextCardId,
                    username: localUsername
                });
            } else {
                sendStateToBackend(card.id, null, card.classList.contains('correct') ? 'correct' : 'wrong', "");
            }
        }, 450); 
    }

    function updateProgress() {
        const currentContainer = document.getElementById(`sheet-${currentSheetIndex}`);
        if (!currentContainer) return;
        const cards = Array.from(currentContainer.querySelectorAll('.card')).filter(c => c.style.display !== 'none');
        const total = cards.length;
        if(total === 0) return;
        const correct = cards.filter(c => c.classList.contains('correct')).length;
        const wrong = cards.filter(c => c.classList.contains('wrong')).length;
        const solved = correct + wrong;
        
        const scoreStr = `${formatNumber(correct)} / ${total}`;
        document.getElementById('progressBar').style.width = `${(solved / total) * 100}%`;
        
        // تحديث العداد في الهيدر والعداد العائم بنفس اللحظة
        document.getElementById('live-score').innerText = scoreStr;
        const floatScore = document.getElementById('float-live-score');
        if (floatScore) floatScore.innerText = scoreStr;
        
        const pct = total === 0 ? 0 : Math.round((correct / total) * 100);
        const scoreCircle = document.getElementById('score-circle');
        if(scoreCircle) scoreCircle.style.background = `conic-gradient(var(--primary) ${pct}%, rgba(255,255,255,0.03) ${pct}%)`;
        
        const scorePct = document.getElementById('score-pct'); if(scorePct) scorePct.innerText = `${pct}%`;
        const statCorrect = document.getElementById('stat-correct'); if(statCorrect) statCorrect.innerText = correct;
        const statWrong = document.getElementById('stat-wrong'); if(statWrong) statWrong.innerText = wrong;
        
        const scoreMsg = document.getElementById('score-msg');
        if(scoreMsg) {
            if(pct >= 85) scoreMsg.innerText = "CLUSTER PERFORMANCE: OPTIMAL META-LEARNING generalisation!";
            else if(pct >= 50) scoreMsg.innerText = "CLUSTER PERFORMANCE: STABLE CONVERGENCE WITH MINIMAL LOSS.";
            else scoreMsg.innerText = "CLUSTER PERFORMANCE: CRITICAL GRADIENT EXPLOSION (HIGH LOSS).";
        }

        if(solved === total && total > 0){
            document.getElementById('score-board').classList.add('active');
        } else {
            document.getElementById('score-board').classList.remove('active');
        }
    }

    function retryMode() {
        const currentContainer = document.getElementById(`sheet-${currentSheetIndex}`);
        currentContainer.querySelectorAll('.card').forEach(c => { resetCardState(c); });
        document.getElementById('score-board').classList.remove('active');
        updateProgress();
        triggerUserActionBurst();
        lastSentState.activeCardId = `sheet-${currentSheetIndex}-${currentGlobalMode}-q-0`;
        sendStateToBackend(null, null, null, "", { active_card_id: `sheet-${currentSheetIndex}-${currentGlobalMode}-q-0` });
    }

    function resetCardState(card) {
        card.classList.remove('wrong', 'correct', 'correct-status', 'wrong-status', 'revealed-vault');
        const btn = card.querySelector('.check-btn');
        if(btn) { btn.disabled = false; btn.innerText = "COMPUTE INFERENCE"; }
        const rb = card.querySelector('.result-box');
        if(rb) rb.innerHTML = '';
        
        const actionRow = card.querySelector('.written-action-row');
        if(actionRow) actionRow.style.display = 'flex';

        if (currentGlobalMode !== 'blank' && currentGlobalMode !== 'written') {
            card.querySelectorAll('.option-label').forEach(lbl => {
                lbl.classList.remove('selected', 'true-answer');
                lbl.style.pointerEvents = 'auto';
            });
            card.querySelectorAll('input').forEach(inp => { inp.disabled = false; inp.checked = false; });
        }
    }

    function mixQuestions() {
        const currentContainer = document.getElementById(`sheet-${currentSheetIndex}`);
        const cards = Array.from(currentContainer.querySelectorAll('.card'));
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentContainer.innerHTML = '';
        cards.forEach((card, index) => {
            card.dataset.index = index;
            const qNumElement = card.querySelector('.q-number');
            if (qNumElement) qNumElement.innerText = `${formatNumber(index + 1)} / ${cards.length}`;
            currentContainer.appendChild(card);
        });
    }

    function mixOptions() {
        if (currentGlobalMode !== 'mcq') return; 
        const currentContainer = document.getElementById(`sheet-${currentSheetIndex}`);
        currentContainer.querySelectorAll('.card').forEach(card => {
            const grid = card.querySelector('.options-grid');
            const labels = Array.from(grid.querySelectorAll('.option-label'));
            for (let i = labels.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [labels[i], labels[j]] = [labels[j], labels[i]];
            }
            grid.innerHTML = '';
            labels.forEach((lbl) => {
                grid.appendChild(lbl);
            });
        });
    }
</script>

<script>
    let roomName = urlParams.get('room');
    const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost:5000' ? 'http://127.0.0.1:5000/api' : '/api';

    const myClientId = 'client-' + Math.random().toString(36).substring(2, 9);
    
    let lastSentState = { sheet: null, mode: null, activeCardId: null };

    let isSyncingFromServer = false, lastActiveCardId = "", currentIntervalDelay = 2500, syncIntervalId = null, burstCountdown = 0;
    let localVoicePeerId = "";

    function startAdaptiveSyncLoop() {
        if (syncIntervalId) clearInterval(syncIntervalId);
        syncIntervalId = setInterval(async () => {
            await fetchRoomState();
            if (burstCountdown > 0) { 
                burstCountdown--; 
                if (burstCountdown === 0) { currentIntervalDelay = 2500; startAdaptiveSyncLoop(); } 
            }
        }, currentIntervalDelay);
    }

    function triggerUserActionBurst() {
        burstCountdown = 10;
        if (currentIntervalDelay !== 800) { currentIntervalDelay = 800; startAdaptiveSyncLoop(); }
    }

    async function fetchRoomState() {
        if (!roomName || isSyncingFromServer) return;
        try {
            isSyncingFromServer = true;
            const url = `${BACKEND_URL}/state?room=${roomName}&peer_id=${localVoicePeerId}&username=${encodeURIComponent(localUsername)}`;
            const response = await fetch(url);
            if (!response.ok) { isSyncingFromServer = false; return; }
            const data = await response.json();
            if (data) {
                let structuralChanged = false;
                const isCooldownActive = (Date.now() - lastLocalActionTime) < 2000;

                if (data.answers) {
                    const serverSolvedCount = Object.keys(data.answers).length;
                    const localSolvedCount = document.querySelectorAll('.card.correct, .card.wrong').length;
                    
                    if (serverSolvedCount === 0 && localSolvedCount > 0) {
                        sendStateToBackend(null, null, null, "", { current_sheet: currentSheetIndex, current_mode: currentGlobalMode });
                        isSyncingFromServer = false; return;
                    }
                }

                if (!isCooldownActive) {
                    const serverSolvedCount = data.answers ? Object.keys(data.answers).length : 0;
                    const localSolvedCount = document.querySelectorAll('.card.correct, .card.wrong').length;

                    if (data.current_sheet !== undefined && data.current_sheet !== null && data.current_sheet !== currentSheetIndex) { 
                        if (data.current_sheet === 0 && currentSheetIndex !== 0 && serverSolvedCount === 0 && localSolvedCount > 0) {
                            sendStateToBackend(null, null, null, "", { current_sheet: currentSheetIndex, current_mode: currentGlobalMode });
                        } else { switchSheet(data.current_sheet); structuralChanged = true; }
                    }
                    
                    if (data.current_mode !== undefined && data.current_mode !== null && data.current_mode !== currentGlobalMode) { 
                        if (data.current_mode === 'tf' && currentGlobalMode !== 'tf' && serverSolvedCount === 0 && localSolvedCount > 0) {
                            sendStateToBackend(null, null, null, "", { current_sheet: currentSheetIndex, current_mode: currentGlobalMode });
                        } else { globalSwitchMode(data.current_mode); structuralChanged = true; }
                    }
                }

                const currentContainer = document.getElementById(`sheet-${currentSheetIndex}`);
                if (currentContainer && currentContainer.innerHTML === "") {
                    structuralChanged = true; renderCurrentView();
                }

                if (data.answers) {
                    Object.keys(data.answers).forEach(cardId => {
                        if (!cardId.startsWith(`sheet-${currentSheetIndex}-${currentGlobalMode}-`)) return;
                        const card = document.getElementById(cardId); if (!card) return;
                        const state = data.answers[cardId];
                        const isFrozen = card.classList.contains('correct') || card.classList.contains('wrong');

                        if (!isFrozen && state.selectedIdx !== null && currentGlobalMode !== 'blank' && currentGlobalMode !== 'written') {
                            card.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('selected'));
                            const targetInp = card.querySelector(`input[value="${state.selectedIdx}"]`);
                            if(targetInp) { targetInp.checked = true; targetInp.parentElement.classList.add('selected'); }
                        }
                        if (state.status === 'correct' && !card.classList.contains('correct')) executeRemoteFreeze(card, cardId, true);
                        else if (state.status === 'wrong' && !card.classList.contains('wrong')) executeRemoteFreeze(card, cardId, false);
                    });
                }

                if (data.voice_peers && data.voice_peers.length > 0) { handleAudioMeshSignaling(data.voice_peers); }

                if (data.active_users) {
                    updateActiveMembersList(data.active_users);
                }

                if (data.active_card_id && (data.active_card_id !== lastActiveCardId || structuralChanged)) {
                    lastActiveCardId = data.active_card_id;
                    document.querySelectorAll('.card').forEach(c => {
                        c.classList.remove('focused-by-peer');
                        const badge = c.querySelector('.peer-focus-badge');
                        if (badge) badge.style.display = 'none';
                    });
                    const t = document.getElementById(data.active_card_id); 
                    if (t) { 
                        t.classList.add('focused-by-peer'); 
                        
                        let focusUser = 'Peer';
                        if (data.active_users) {
                            const otherPeers = Object.keys(data.active_users).filter(id => id !== localVoicePeerId);
                            if (otherPeers.length > 0) {
                                focusUser = data.active_users[otherPeers[0]] || 'Peer';
                            }
                        }
                        
                        const badge = document.getElementById(`${data.active_card_id}-peer-badge`);
                        if (badge) {
                            badge.innerHTML = `👤 <b>${focusUser}</b>`;
                            badge.style.display = 'inline-flex';
                        }

                        if (!isCooldownActive && data.active_card_id !== lastSentState.activeCardId) {
                            setTimeout(() => { fastScrollTo(t); }, 50); 
                        }
                    } 
                }
                updateProgress();
            }
            isSyncingFromServer = false;
        } catch (error) { isSyncingFromServer = false; }
    }

    function updateActiveMembersList(activeUsers) {
        const container = document.getElementById('membersListContainer');
        const countBadge = document.getElementById('active-members-count');
        const floatCountBadge = document.getElementById('float-members-count');
        if (!container || !activeUsers) return;

        container.innerHTML = '';
        const userIds = Object.keys(activeUsers);
        
        // تحديث العداد في الهيدر والعداد العائم بنفس اللحظة
        if (countBadge) countBadge.innerText = userIds.length;
        if (floatCountBadge) floatCountBadge.innerText = userIds.length;

        userIds.forEach(peerId => {
            const name = activeUsers[peerId];
            const isMe = peerId === localVoicePeerId;
            
            const item = document.createElement('div');
            item.className = 'member-item';
            item.innerHTML = `
                <div class="member-status-dot"></div>
                <div class="member-details">
                    <span class="member-name">${name} ${isMe ? '<span class="me-tag">(You)</span>' : ''}</span>
                    <span class="member-peer-id">${peerId}</span>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function executeRemoteFreeze(card, cardId, isCorrect) {
        if (currentGlobalMode !== 'blank' && currentGlobalMode !== 'written') {
            const btn = card.querySelector('.check-btn'); if(btn) { btn.disabled = true; btn.innerText = "WEIGHTS FROZEN"; }
            card.querySelectorAll('input').forEach(inp => inp.disabled = true); 
            card.querySelectorAll('.option-label').forEach(lbl => { lbl.style.pointerEvents = 'none'; if(parseInt(lbl.querySelector('input').value) === parseInt(card.dataset.correct)) lbl.classList.add('true-answer'); }); 
            card.classList.add(isCorrect ? 'correct' : 'wrong');
            card.classList.add(isCorrect ? 'correct-status' : 'wrong-status');
        } else {
            card.classList.add('revealed-vault');
            card.classList.add(isCorrect ? 'correct' : 'wrong');
            card.classList.add(isCorrect ? 'correct-status' : 'wrong-status');
            const actionRow = card.querySelector('.written-action-row'); if(actionRow) actionRow.style.display = 'none';
        }
        
        playAudioFeedback(isCorrect ? 'correct' : 'wrong');
    }

    async function sendStateToBackend(cardId, selectedIdx, status, inputValue = "", extraFields = {}) {
        if (!roomName) return;
        if (cardId) lastSentState.activeCardId = cardId;
        if (extraFields.active_card_id) lastSentState.activeCardId = extraFields.active_card_id;
        if (extraFields.current_sheet !== undefined) lastSentState.sheet = extraFields.current_sheet;
        if (extraFields.current_mode !== undefined) lastSentState.mode = extraFields.current_mode;

        try {
            await fetch(`${BACKEND_URL}/update`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    room: roomName, cardId: cardId, selectedIdx: selectedIdx, status: status, inputValue: inputValue, senderId: myClientId, 
                    current_sheet: currentSheetIndex, current_mode: currentGlobalMode, ...extraFields 
                })
            });
        } catch (error) {}
    }

    const originalSelectOption = selectOption;
    selectOption = function(cardId, optionIndex) {
        originalSelectOption(cardId, optionIndex);
        triggerUserActionBurst();
        sendStateToBackend(cardId, optionIndex, 'selected', "", { active_card_id: cardId });
    };

    let localAudioStream = null; let peerInstance = null; let connectedVoicePeersList = new Set();
    let activeCallsList = {};
    let dataConnections = {}; 

    function initializeVoiceEngine() {
        const btn = document.getElementById('micToggleBtn');
        const floatBtn = document.getElementById('floatMicBtn');
        
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localAudioStream = stream;
                localVoicePeerId = `peer-${roomName}-${Math.floor(100000 + Math.random() * 900000)}`;
                peerInstance = new Peer(localVoicePeerId, { debug: 1 });

                peerInstance.on('open', (id) => {
                    btn.classList.add('active-streaming'); 
                    btn.innerHTML = "🎙️";
                    if (floatBtn) {
                        floatBtn.innerHTML = "🎙️";
                        floatBtn.style.color = "var(--success)";
                    }
                    if (roomName) startAdaptiveSyncLoop();
                });

                peerInstance.on('connection', (conn) => {
                    handleDataConnection(conn);
                });

                peerInstance.on('call', (call) => {
                    connectedVoicePeersList.add(call.peer);
                    activeCallsList[call.peer] = call;
                    call.answer(localAudioStream);
                    call.on('stream', (remoteStream) => { handleRemoteAudioPlayback(call.peer, remoteStream); });
                    call.on('close', () => { removeRemoteAudioPlayback(call.peer); });
                    call.on('error', () => { removeRemoteAudioPlayback(call.peer); });
                });
            })
            .catch(err => {
                btn.style.background = "var(--danger)"; 
                btn.innerHTML = "⚠️";
                if (floatBtn) {
                    floatBtn.innerHTML = "⚠️";
                    floatBtn.style.color = "var(--danger)";
                }
                if (roomName) startAdaptiveSyncLoop();
            });
    }

    function handleAudioMeshSignaling(serverPeers) {
        serverPeers.forEach(remotePeerId => {
            if (remotePeerId === localVoicePeerId) return;

            if (remotePeerId > localVoicePeerId) {
                if (!connectedVoicePeersList.has(remotePeerId)) {
                    connectedVoicePeersList.add(remotePeerId);
                    const call = peerInstance.call(remotePeerId, localAudioStream);
                    if (call) {
                        activeCallsList[remotePeerId] = call;
                        call.on('stream', (remoteStream) => { handleRemoteAudioPlayback(remotePeerId, remoteStream); });
                        call.on('close', () => { removeRemoteAudioPlayback(remotePeerId); });
                        call.on('error', () => { removeRemoteAudioPlayback(remotePeerId); });
                    }
                }
                if (!dataConnections[remotePeerId]) {
                    const conn = peerInstance.connect(remotePeerId);
                    if (conn) {
                        handleDataConnection(conn);
                    }
                }
            }
        });

        connectedVoicePeersList.forEach(remotePeerId => {
            if (!serverPeers.includes(remotePeerId) && remotePeerId !== localVoicePeerId) {
                removeRemoteAudioPlayback(remotePeerId);
            }
        });

        Object.keys(dataConnections).forEach(remotePeerId => {
            if (!serverPeers.includes(remotePeerId)) {
                if (dataConnections[remotePeerId]) {
                    dataConnections[remotePeerId].close();
                }
                delete dataConnections[remotePeerId];
            }
        });
    }

    function handleDataConnection(conn) {
        dataConnections[conn.peer] = conn;
        conn.on('data', (data) => {
            handleIncomingDataMessage(data);
        });
        conn.on('close', () => {
            delete dataConnections[conn.peer];
        });
        conn.on('error', () => {
            delete dataConnections[conn.peer];
        });
    }

    function handleIncomingDataMessage(data) {
        if (!data) return;
        const isCooldownActive = (Date.now() - lastLocalActionTime) < 1500;
        if (isCooldownActive) return; 

        if (data.type === 'select') {
            const card = document.getElementById(data.cardId);
            if (card && !card.classList.contains('correct') && !card.classList.contains('wrong')) {
                card.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('selected'));
                const targetInp = card.querySelector(`input[value="${data.optionIdx}"]`);
                if (targetInp) {
                    targetInp.checked = true;
                    targetInp.parentElement.classList.add('selected');
                }
            }
        } else if (data.type === 'freeze') {
            const card = document.getElementById(data.cardId);
            if (card && !card.classList.contains('correct') && !card.classList.contains('wrong')) {
                if (data.selectedIdx !== null && data.selectedIdx !== undefined) {
                    card.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('selected'));
                    const targetInp = card.querySelector(`input[value="${data.selectedIdx}"]`);
                    if (targetInp) {
                        targetInp.checked = true;
                        targetInp.parentElement.classList.add('selected');
                    }
                }
                executeRemoteFreeze(card, data.cardId, data.status === 'correct');
                updateProgress();
            }
        } else if (data.type === 'sheet') {
            if (currentSheetIndex !== data.index) {
                switchSheet(data.index, false);
            }
        } else if (data.type === 'mode') {
            if (currentGlobalMode !== data.mode) {
                globalSwitchMode(data.mode, false);
            }
        } else if (data.type === 'focus') {
            document.querySelectorAll('.card').forEach(c => {
                c.classList.remove('focused-by-peer');
                const badge = c.querySelector('.peer-focus-badge');
                if (badge) badge.style.display = 'none';
            });
            const t = document.getElementById(data.cardId);
            if (t) {
                t.classList.add('focused-by-peer');
                const badge = document.getElementById(`${data.cardId}-peer-badge`);
                if (badge) {
                    badge.innerHTML = `👤 <b>${data.username || 'Peer'}</b>`;
                    badge.style.display = 'inline-flex';
                }
                fastScrollTo(t); 
            }
        }
    }

    function broadcastP2PState(payload) {
        Object.values(dataConnections).forEach(conn => {
            if (conn && conn.open) {
                try {
                    conn.send(payload);
                } catch(e) {}
            }
        });
    }

    function removeRemoteAudioPlayback(peerId) {
        connectedVoicePeersList.delete(peerId);
        if (activeCallsList[peerId]) {
            try { activeCallsList[peerId].close(); } catch(e){}
            delete activeCallsList[peerId];
        }
        const audioNode = document.getElementById(`audio_${peerId}`);
        if (audioNode) {
            audioNode.srcObject = null;
            audioNode.remove();
        }
    }

    function handleRemoteAudioPlayback(peerId, remoteStream) {
        if (document.getElementById(`audio_${peerId}`)) return;
        const audioNode = document.createElement('audio');
        audioNode.id = `audio_${peerId}`; audioNode.srcObject = remoteStream; audioNode.autoplay = true;
        document.body.appendChild(audioNode);
    }

    function toggleLocalMicrophone() {
        if (!localAudioStream) return;
        const btn = document.getElementById('micToggleBtn');
        const floatBtn = document.getElementById('floatMicBtn');
        const audioTrack = localAudioStream.getAudioTracks()[0];
        
        if (audioTrack.enabled) {
            audioTrack.enabled = false; 
            btn.classList.remove('active-streaming');
            btn.style.background = "var(--glass-bg)"; 
            btn.style.borderColor = "var(--warning)"; 
            btn.style.color = "var(--warning)"; 
            btn.innerHTML = "🔇";
            
            if (floatBtn) {
                floatBtn.innerHTML = "🔇";
                floatBtn.style.color = "var(--warning)";
            }
        } else {
            audioTrack.enabled = true; 
            btn.classList.add('active-streaming');
            btn.style.background = ""; 
            btn.style.borderColor = ""; 
            btn.style.color = ""; 
            btn.innerHTML = "🎙️";
            
            if (floatBtn) {
                floatBtn.innerHTML = "🎙️";
                floatBtn.style.color = "var(--success)";
            }
        }
    }

    let lastScrollY = window.scrollY;
    window.addEventListener('scroll', () => {
        const header = document.getElementById('mainHeader'); 
        const scrollBtn = document.getElementById('scrollTopBtn');
        const membersPanel = document.getElementById('membersPanel');
        const floatingCapsule = document.getElementById('floatingCapsule');

        if (!header) return;
        
        if (window.scrollY > 250) { 
            if(scrollBtn) scrollBtn.classList.add('visible'); 
        } else { 
            if(scrollBtn) scrollBtn.classList.remove('visible'); 
        }
        
        if (!isProgrammaticScrolling) {
            if (window.scrollY > lastScrollY && window.scrollY > 80) { 
                header.classList.add('hide-nav'); 
                if (membersPanel) membersPanel.style.top = '75px';
                if (floatingCapsule) floatingCapsule.classList.add('visible');
            } else if (window.scrollY < lastScrollY) { 
                header.classList.remove('hide-nav'); 
                if (membersPanel) membersPanel.style.top = '145px';
                if (floatingCapsule) floatingCapsule.classList.remove('visible');
            }
        }
        lastScrollY = window.scrollY;
    });

    initializeVoiceEngine();
    initSuite();
</script>
</body>
</html>
